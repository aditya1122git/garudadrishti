services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [database]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-jannetra}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the deployment environment}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the deployment environment}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_INITIAL_LOOKBACK_DAYS: ${YOUTUBE_INITIAL_LOOKBACK_DAYS:-7}
      YOUTUBE_TERMS_PER_QUERY: ${YOUTUBE_TERMS_PER_QUERY:-4}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      APIFY_FACEBOOK_ACTOR_ID: ${APIFY_FACEBOOK_ACTOR_ID:-}
      APIFY_INSTAGRAM_ACTOR_ID: ${APIFY_INSTAGRAM_ACTOR_ID:-}
      APIFY_X_ACTOR_ID: ${APIFY_X_ACTOR_ID:-}
      APIFY_NEWS_ACTOR_ID: ${APIFY_NEWS_ACTOR_ID:-}
      APIFY_FACEBOOK_INPUT_JSON: ${APIFY_FACEBOOK_INPUT_JSON:-}
      APIFY_INSTAGRAM_INPUT_JSON: ${APIFY_INSTAGRAM_INPUT_JSON:-}
      APIFY_X_INPUT_JSON: ${APIFY_X_INPUT_JSON:-}
      APIFY_NEWS_INPUT_JSON: ${APIFY_NEWS_INPUT_JSON:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      HF_MODEL: ${HF_MODEL:-cardiffnlp/twitter-xlm-roberta-base-sentiment}
      HF_REVISION: ${HF_REVISION:-f2f1202b1bdeb07342385c3f807f9c07cd8f5cf8}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_CACHE_DIR: /home/app/.cache/huggingface
      HF_DEVICE: ${HF_DEVICE:-cpu}
      HF_BATCH_SIZE: ${HF_BATCH_SIZE:-16}
      HF_MAX_LENGTH: ${HF_MAX_LENGTH:-256}
      HF_CPU_THREADS: ${HF_CPU_THREADS:-2}
      HF_LOCAL_FILES_ONLY: ${HF_LOCAL_FILES_ONLY:-false}
      HF_CONFIDENCE_THRESHOLD: ${HF_CONFIDENCE_THRESHOLD:-0.75}
      GROQ_CONCURRENCY: ${GROQ_CONCURRENCY:-2}
      ENABLED_PLATFORMS: ${ENABLED_PLATFORMS:-facebook,instagram,x,youtube,news}
      APIFY_MAX_ITEMS: ${APIFY_MAX_ITEMS:-50}
      APIFY_RUN_TIMEOUT_SECONDS: ${APIFY_RUN_TIMEOUT_SECONDS:-240}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:-}
      REPORTING_TIMEZONE: ${REPORTING_TIMEZONE:-Asia/Kolkata}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - hf_cache:/home/app/.cache/huggingface
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks: [database, web]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      start_period: 90s
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [web]
networks:
  database:
    internal: true
  web:
volumes:
  mongo_data:
  hf_cache:
